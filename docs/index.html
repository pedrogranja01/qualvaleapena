<body>
<main class="app">
  <h1>🔍 Comparador de Preços</h1>
  <p class="subtitle">Preencha as informações abaixo para comparar o custo-benefício entre dois produtos.</p>

  <form id="form">
    <div class="produtos">
      <fieldset class="produto">
        <legend>Produto 1</legend>
        <label>Preço (R$)
          <input type="number" inputmode="decimal" step="0.01" min="0" id="p1" placeholder="0,00">
        </label>
        <label>Unidade
          <select id="u1">
            <option value="mg">mg</option>
            <option value="g" selected>g</option>
            <option value="kg">kg</option>
            <option value="mL">mL</option>
            <option value="L">L</option>
          </select>
        </label>
        <label>Qtd
          <input type="number" inputmode="decimal" step="0.01" min="0" id="q1" placeholder="Quantidade">
        </label>
      </fieldset>

      <fieldset class="produto">
        <legend>Produto 2</legend>
        <label>Preço (R$)
          <input type="number" inputmode="decimal" step="0.01" min="0" id="p2" placeholder="0,00">
        </label>
        <label>Unidade
          <select id="u2">
            <option value="mg">mg</option>
            <option value="g" selected>g</option>
            <option value="kg">kg</option>
            <option value="mL">mL</option>
            <option value="L">L</option>
          </select>
        </label>
        <label>Qtd
          <input type="number" inputmode="decimal" step="0.01" min="0" id="q2" placeholder="Quantidade">
        </label>
      </fieldset>
    </div>

    <hr>

    <div class="botoes">
      <button type="submit" class="btn primario">Comparar</button>
      <button type="button" class="btn" id="limpar">Limpar</button>
    </div>
  </form>

  <div id="resultado" class="resultado" hidden></div>
</main>

<script src="app.js"></script>
</body>
</html>
